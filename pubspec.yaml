name: ecoscan
description: Экологический сканер продуктов
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Сканер штрих-кодов
  mobile_scanner: ^3.5.5
  
  # Локальное хранилище
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Монетизация
  purchases_flutter: ^6.29.0
  
  # Навигация и состояние
  provider: ^6.1.1
  
  # UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/products.json
    - assets/images/
